spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: false

  security:
    secret: dev-secret-key-troque-em-producao-min-32-chars
    expiration: 86400000

server:
  port: 8080
  servlet:
    context-path: /nix-finance-api

app:
  saas:
    plans:
      free:
        category-limit: 2
  rate-limit:
    enabled: false
    global:
      requests-per-minute: 5
    auth:
      requests-per-minute: 2
  client:
    url:
      calendar-api: http://localhost
    calendar-api:
      api-key: test-key

spring.threads.virtual.enabled: true

aws:
  enabled: false
  sqs:
    queues:
      installment-generation: http://test-queue/000000000000/installment-generation-queue
